<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="description" content="Shared graphs, calculators and project notes.">
  <title>Shared Lab</title>
  <style>
    :root {
      color-scheme:light dark;
      --bg:#fff; --ink:#1f2328; --ink-2:#4b5058; --muted:#62666e; --line:#e6e7ea; --rule:#c9ccd1; --link:#1f5aa8; --hover:#f5f6f7;
      --serif:ui-serif,"Iowan Old Style",Charter,"Sitka Text","Palatino Linotype",Georgia,serif;
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    @media (prefers-color-scheme:dark) { :root { --bg:#181818; --ink:#ececed; --ink-2:#c4c6cb; --muted:#a4a7ad; --line:#2d2f33; --rule:#4a4c52; --link:#9cc3ff; --hover:#212225; } }
    * { box-sizing:border-box; }
    html { scrollbar-color:var(--muted) var(--bg); -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--sans); }
    ::selection { background:var(--link); color:var(--bg); }
    a { color:var(--link); text-underline-offset:.2em; }
    a:focus-visible { outline:2px solid var(--link); outline-offset:3px; border-radius:4px; }
    main { max-width:54rem; margin:0 auto; padding:clamp(40px,9vw,104px) clamp(20px,5vw,40px) 48px; }
    .masthead { margin-bottom:clamp(36px,6vw,56px); }
    h1 { font-family:var(--serif); font-size:clamp(34px,5.5vw,48px); font-weight:500; line-height:1.1; letter-spacing:-.015em; margin:0 0 14px; text-wrap:balance; }
    .intro { margin:0; max-width:54ch; font-size:17px; color:var(--ink-2); text-wrap:pretty; }
    .collection-head { padding-bottom:10px; border-bottom:1px solid var(--rule); }
    h2 { margin:0; font-size:13px; font-weight:600; line-height:1.4; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
    .projects { list-style:none; margin:0; padding:0; }
    .project { border-bottom:1px solid var(--line); }
    .project > p { margin:0; padding:24px 0; color:var(--muted); }
    .project a { display:grid; grid-template-columns:10.5rem minmax(0,1fr) auto; column-gap:24px; align-items:baseline; margin-inline:-12px; padding:24px 12px; border-radius:6px; color:inherit; text-decoration:none; }
    .project a > span { grid-column:2; grid-row:1; min-width:0; }
    .project time { grid-column:1; grid-row:1; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .project a::after { content:"→"; content:"→" / ""; grid-column:3; grid-row:1; color:var(--muted); font-size:18px; line-height:1; }
    .project-title { display:block; font-family:var(--serif); font-size:22px; font-weight:500; line-height:1.25; color:var(--link); text-decoration:underline; text-decoration-thickness:1px; text-decoration-color:color-mix(in srgb,var(--link) 35%,transparent); text-underline-offset:.22em; text-wrap:balance; }
    .description { display:block; max-width:60ch; margin-top:6px; color:var(--ink-2); text-wrap:pretty; }
    .project a:hover { background:var(--hover); }
    .project a:hover .project-title { text-decoration-color:currentColor; }
    .project a:hover::after { color:var(--link); }
    .project a:focus-visible { outline-offset:0; }
    footer { margin-top:clamp(56px,9vw,88px); padding-top:16px; border-top:1px solid var(--line); font-size:14px; color:var(--muted); }
    footer p { margin:0 0 6px; max-width:62ch; }
    @media (max-width:640px) {
      .project a { grid-template-columns:minmax(0,1fr) auto; row-gap:6px; padding:20px 12px; }
      .project time { grid-column:1; grid-row:1; }
      .project a > span { grid-column:1; grid-row:2; }
      .project a::after { grid-column:2; grid-row:2; }
      .project-title { font-size:20px; }
      .intro { font-size:16px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <h1>Shared Lab</h1>
      <p class="intro">Graphs, calculators and notes we're working on. Open a project to explore the numbers and try different inputs.</p>
    </header>
    <section class="collection" aria-labelledby="collection-title">
      <div class="collection-head"><h2 id="collection-title">Projects</h2></div>
      <ul class="projects">{{PROJECTS}}</ul>
    </section>
    <footer>
      <p>Anyone with the link can view these projects.</p>
      <p>Interactive inputs are saved in your browser. Each person can explore their own settings.</p>
    </footer>
  </main>
</body>
</html>
