<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="description" content="Shared graphs, calculators and project notes.">
  <title>Shared Lab</title>
  <style>
    :root { color-scheme:light dark; --bg:#fff; --ink:#202124; --muted:#60636a; --line:#d9dce1; --link:#225baf; --hover:#f5f7fa; }
    @media (prefers-color-scheme:dark) { :root { --bg:#181818; --ink:#ededee; --muted:#adaeb4; --line:#44454b; --link:#a6c8ff; --hover:#242529; } }
    * { box-sizing:border-box; }
    html { scrollbar-color:var(--muted) var(--bg); }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    ::selection { background:var(--link); color:var(--bg); }
    a { color:var(--link); text-underline-offset:.2em; }
    a:focus-visible { outline:3px solid var(--link); outline-offset:5px; }
    main { max-width:960px; margin:0 auto; padding:clamp(28px,6vw,72px) 24px 48px; }
    h1 { font-size:clamp(28px,4vw,40px); line-height:1.2; letter-spacing:-.025em; margin:0 0 16px; font-weight:650; text-wrap:balance; }
    .intro { margin:0; max-width:68ch; color:var(--muted); }
    .collection { margin-top:48px; }
    h2 { font-size:20px; font-weight:600; margin:0 0 12px; }
    .projects { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
    .project { border-bottom:1px solid var(--line); }
    .project a { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 28px; padding:24px 8px; text-decoration:none; }
    .project a:hover { background:var(--hover); }
    .project a:focus-visible { outline-offset:-3px; }
    .project-title { font-size:19px; font-weight:600; text-decoration:underline; text-underline-offset:.22em; }
    .description { display:block; color:var(--muted); max-width:65ch; margin-top:8px; }
    time { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; padding-top:4px; }
    footer { border-top:1px solid var(--line); margin-top:64px; padding-top:20px; font-size:14px; color:var(--muted); max-width:75ch; }
    footer p { margin:0 0 8px; }
    @media (max-width:560px) { main { padding:28px 20px; } .collection { margin-top:36px; } .project a { grid-template-columns:minmax(0,1fr); gap:12px; padding:20px 0; } footer { margin-top:40px; } }
  </style>
</head>
<body>
  <main>
    <h1>Shared Lab</h1>
    <p class="intro">Graphs, calculators and notes we're working on. Open a project to explore the numbers and try different inputs.</p>
    <section class="collection" aria-labelledby="collection-title">
      <h2 id="collection-title">Projects</h2>
      <ul class="projects">{{PROJECTS}}</ul>
    </section>
    <footer>
      <p>Anyone with the link can view these projects.</p>
      <p>Interactive inputs are saved in your browser. Each person can explore their own settings.</p>
    </footer>
  </main>
</body>
</html>
